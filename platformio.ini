
; PlatformIO template configuration file for megaTinyCore on:
; https://github.com/SpenceKonde/megaTinyCore/
;
; environments:
; uart_baseplate   (oldVersion) : baseplate firmware, PC-controlled building sequence (start/stop, no cube feedback yet)
; uart_baseplate_state_machine  : baseplate firmware, PC-controlled, implemented as an explicit state machine (successor of uart_baseplate)
; baseplate_state_machine_debug2 : same as uart_baseplate_state_machine, but also flushes buffered SER_PRINTLN debug codes between cycles (log_flush)
; baseplate_state_machine_debug : baseplate state machine without a PC - runs continuously, cycling the predefined feedback patterns from feedback.h
; uart_cube                     : current brick firmware - pairs with uart_baseplate / uart_baseplate_state_machine
; uart_cube_state_machine       : brick firmware, implemented as an explicit state machine (successor of uart_cube) - pairs with uart_baseplate_state_machine
; uart_test                     : minimal PC <-> ATtiny UART handshake test
; led_test                      : standalone RGB LED color-order check (see firmware/src/lib/led_test.cpp)
; Upload_UPDI / set_fuses       : upload/fuse utility environments, not firmware variants

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = uart_cube

; Parameters used for all environments
[env]
platform = atmelmegaavr
framework = arduino

; Chip in use
board = ATtiny1616
; Clock frequency in [Hz]
board_build.f_cpu = 20000000L
; Oscillator type (internal or external)
board_hardware.oscillator = internal

; Unflag build flags
build_unflags =
; Extra build flags
build_flags =

; Serial monitor baud rate
monitor_speed = 115200

; PC-controlled building sequence (start/stop, no cube feedback yet)
; Flash with: pio run -e uart_baseplate -t upload
[env:uart_baseplate]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<lib/pc_communication.cpp>
    +<lib/cube_hardware.cpp>
    +<firmware_baseplate/uart_main_baseplate.cpp>

build_flags =
    ;-DNODE_ID=0x12
    ;-DCHILD_COUNT=1
    -DCUBE_TYPE_BASEPLATE

; PC-controlled building sequence, implemented as an explicit state
; machine (state-machine version of uart_baseplate)
; Flash with: pio run -e uart_baseplate_state_machine -t upload
[env:uart_baseplate_state_machine]
upload_protocol = serialupdi
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_hardware.updipin = updi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<lib/pc_communication.cpp>
    +<lib/cube_hardware.cpp>
    +<state_machine/baseplate_state_machine2.cpp>


build_flags =
    ;-DNODE_ID=0x12
    ;-DCHILD_COUNT=1
    -DCUBE_TYPE_BASEPLATE

; Same as uart_baseplate_state_machine (PC-controlled, real feedback), but
; additionally flushes buffered SER_PRINTLN debug codes (NA/WA/CV/CFA/FFA/...)
; between cycles via log_flush() - see baseplate_state_machine_debug2.cpp.
[env:baseplate_state_machine_debug2]
upload_protocol = serialupdi
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_hardware.updipin = updi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<lib/pc_communication.cpp>
    +<lib/cube_hardware.cpp>
    +<state_machine/baseplate_state_machine_debug2.cpp>

build_flags =
    -DCUBE_TYPE_BASEPLATE

; Non-PC-controlled baseplate state machine: runs continuously, cycles the
; predefined feedback patterns from feedback.h instead of PC-supplied data.
[env:baseplate_state_machine_debug]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<lib/cube_hardware.cpp>
    +<state_machine/baseplate_state_machine_debug.cpp>

build_flags =
    -DCUBE_TYPE_BASEPLATE

; Cube firmware for the PC-controlled building sequence (pair of uart_baseplate)
; Flash each cube with its own NODE_ID:
;   pio run -e uart_cube -t upload   (edit NODE_ID below per cube: 0x10/0x11/0x12)
[env:uart_cube]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback_cube.cpp>
    ;+<lib/feedback.cpp>
    +<lib/cube_hardware.cpp>
    +<firmware_cube/final_uart_main_cube.cpp>
build_flags =
    ; defining cube type and instance which creates NODE_ID
    -DCUBE_TYPE_NORMAL
    -DCUBE_INSTANCE=1
    ;-DCHILD_COUNT=5
    ; no need of manually defining NODE_ID -> already done by DCUBE_TYPEx and DCUBE_INSTANCE= x
    ;-DNODE_ID=0x11

; Cube firmware for the PC-controlled building sequence, implemented as an
; explicit state machine (state-machine version of uart_cube)
; Flash each cube with its own NODE_ID:
;   pio run -e uart_cube_state_machine -t upload   (edit CUBE_INSTANCE below per cube)
[env:uart_cube_state_machine]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/detection.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback_cube.cpp>
    +<lib/cube_hardware.cpp>
    +<state_machine/cube_state_machine.cpp>
build_flags =
    ; defining cube type and instance which creates NODE_ID
    -DCUBE_TYPE_SMASHED
    -DCUBE_INSTANCE=1
    ; no need of manually defining NODE_ID -> already done by DCUBE_TYPEx and DCUBE_INSTANCE= x

; Minimal PC <-> ATtiny UART handshake test (see src/firmware_test/)
; Flash with: pio run -e uart_test -t upload
[env:uart_test]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<firmware_test/main_uart_handshake.cpp>


; Minimal test for one Würth IC RGB LED on PB5
; Source file: src/lib/led_test.cpp
; Flash with: pio run -e led_test -t upload
[env:led_test]
upload_protocol = serialupdi

build_src_filter =
    -<*>
    +<lib/led_test.cpp>


; Run the following command to upload with this environment
; pio run -e Upload_UPDI -t upload
[env:Upload_UPDI]
; Upload protocol for UPDI upload
upload_protocol = serialupdi
;upload_port = COM6
upload_flags =


; run the following command to set fuses
; pio run -t fuses -e set_fuses
[env:set_fuses]
; Upload protocol for used to set fuses
upload_protocol = ${env:Upload_UPDI.upload_protocol}
upload_flags =
; Hardware settings
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_hardware.updipin = updi

