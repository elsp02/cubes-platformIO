

; PlatformIO template configuration file for megaTinyCore
; https://github.com/SpenceKonde/megaTinyCore/
;
;
; documentation for the other options
; https://github.com/SpenceKonde/megaTinyCore/blob/master/PlatformIO.md
; https://docs.platformio.org/page/projectconf.html
; https://docs.platformio.org/en/latest/platforms/atmelmegaavr.html

[platformio]
; Default build target
default_envs = baseplate

; Parameters used for all environments
[env]
platform = atmelmegaavr
framework = arduino

; Chip in use
board = ATtiny1616
; Clock frequency in [Hz]
board_build.f_cpu = 20000000L
; Oscillator type (internal or external)
board_hardware.oscillator = internal

; Unflag build flags
build_unflags =
; Extra build flags
build_flags =

; Monitor port is auto detected. Override here
;monitor_port =
; Serial monitor baud rate
monitor_speed = 115200

[env:baseplate]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/parser.cpp>
    +<lib/poll_child.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<firmware_baseplate/main_baseplate_feedback2.cpp>

build_flags =
    -DNODE_ID=0x12
    -DCHILD_COUNT=1

[env:cube]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<firmware_cube/main_cube_feedback2.cpp>
    +<lib/poll_child.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>

build_flags =
    -DCHILD_COUNT=2
    -DNODE_ID=0x12
    
; PC-controlled building sequence (start/stop, no cube feedback yet)
; Flash with: pio run -e uart_baseplate -t upload
[env:uart_baseplate]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/parser.cpp>
    +<lib/poll_child.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<firmware_baseplate/uart_main_baseplate.cpp>

build_flags =
    -DNODE_ID=0x12
    -DCHILD_COUNT=1

; Cube firmware for the PC-controlled building sequence (pair of uart_baseplate)
; Flash each cube with its own NODE_ID:
;   pio run -e uart_cube -t upload   (edit NODE_ID below per cube: 0x10/0x11/0x12)
[env:uart_cube]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<lib/wire_bus.cpp>
    +<lib/poll_child.cpp>
    +<lib/serial_writing.cpp>
    +<lib/feedback.cpp>
    +<firmware_cube/uart_main_cube.cpp>

build_flags =
    -DCHILD_COUNT=2
    -DNODE_ID=0x12

; Minimal PC <-> ATtiny UART handshake test (see src/firmware_test/)
; Flash with: pio run -e uart_test -t upload
[env:uart_test]
upload_protocol = serialupdi
build_src_filter =
    -<*>
    +<firmware_test/main_uart_handshake.cpp>

; Run the following command to upload with this environment
; pio run -e Upload_UPDI -t upload
[env:Upload_UPDI]
; Upload protocol for UPDI upload
upload_protocol = serialupdi
;upload_port = COM6
upload_flags =


; run the following command to set fuses
; pio run -t fuses -e set_fuses
[env:set_fuses]
; Upload protocol for used to set fuses
upload_protocol = ${env:Upload_UPDI.upload_protocol}
upload_flags =
; Hardware settings
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_hardware.updipin = updi

