<!DOCTYPE html>
<html lang=" de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>BA CUBES</title>
        <link href="https://fonts.googleapis.com/css2?family=Lemon&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css">
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main>
            <div class="main-container" id="bauen-page">
                <section class="header-container">
                    <div id="process-leiste" class="progress-track">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="button" id="zurück">zurück</div>
                </section>

                <section class="trees">
                    <!-- live build status (mock data for now, see bauen.js) -->
                    <div class="scene-container">
                        <div class="cube" id="build-scene"></div>
                    </div>

                    <!-- small target-tree preview; double-click to expand -->
                    <div class="target-tree-container-window" id="target-tree-container-window">
                        <div class="cube" id="target-tree"></div>
                    </div>
                </section>

                <div class="footer-section">
                    <div class="footer-container">
                        <div class="footer" id="monitor">monitor</div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
        <!-- shows the in-progress build (mock data) + a target-tree preview that expands on double-click -->
        <script type="module" src="./src/bauen.js"></script>
    </body>
</html>
