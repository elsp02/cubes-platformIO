<!DOCTYPE html>
<html lang=" de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>BA CUBES</title>
        <link href="https://fonts.googleapis.com/css2?family=Lemon&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css">
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main>
            <!--loader side-->
           <div id="loader-container" aria-hidden = "true"> <!-- dissapears when client connected to server --> 
                <div class="centered-container">
                <img 
                    id = "loader-gif"
                    src="img/pongo_dance.gif"
                    alt = ""
                    width = "480"
                    height = "480"
                    decoding = "async"
                />
                <p class="typo-text" >...verbinden</p>
                </div>
           </div>

           <!--dashboard-->
           <div class="main-container" id="main-container-dashboard">
                <div class="header-section">
                    <div class="header-container">
                        <div class="header" id="monitor">monitor</div> <!--capable of folding-->
                    </div>
                </div>

                <!--tree selection - I want the centered card bigger than the others-->
                <div class="centered-container" id="centered-container-dashboard">
                    <span class="typo-title">BAUM AUSWAHL</span>
                    <section class="scroll-section autoShow"> <!--I want to have points-->
                        <!-- cards are generated by tree_thumbnail.js, one per target tree -->
                        <div class="scroll-container"></div>
                    </section>
                </div>

                <!--level selection - background is blurred-->
                <div class="centered-container" id="centered-container-level">
                    <div class="window-container" id="window-container-level">
                        <div class="button" id="zurück">zurück</div>
                        <div class="typo-title">Level auswählen</div>
                        <div id="level-container">
                            <div class="level" id="level-1">level 1</div>
                            <div class="level" id="level-2">level 2</div>
                        <div class="button" id="ok-button">ok</div> <!-- tree_preview side opens with selected target tree-->
                        </div>
                    </div>
                </div>

                <div class="banner" >
                    <button class="monitor">monitor</button>
                </div>


           </div>
           
            <div id = "main-container">
                <section class = "button-section">
                    <button class = "button typo-text active" id="original">original</button>
                    <button class = "button typo-text" id="valid">gültig</button>
                    <button class = "button typo-text" id="invalid">falsch</button>
                    <button class = "button typo-text" id="ghost">ghost</button>
                </section>

               <section id = "orbit-container">
                    <div class = "cube" id="target-tree"></div>
               </section>
            </div>
        </main>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
        <script src= "./src/loader_page.js"> </script>
        <!-- entry point: builds the test scene and wires the buttons -->
        <script type="module" src="./src/scene_test.js"></script>
        <!-- renders the target tree once and puts it on the selection cards -->
        <script type="module" src="./src/tree_thumbnail.js"></script>
        <!-- wires card double-click -> level select -> tree_preview.html -->
        <script type="module" src="./src/tree_selection.js"></script>
    </body>
</html>
