<!DOCTYPE html>
<html lang=" de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>BA CUBES</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        >
        <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css">
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main>
            <div class="loader-container">
            <!--loader side - dissapears when client connected to server -->
                <section class="centered-section" id="loader">  
                    <div class="centered-container" id="loader-container" aria-hidden = "true">
                        <img 
                            id = "loader-gif"
                            src="./img/gif/brick_loader.gif"
                            alt = ""
                            width = "470"
                            height = "470"
                            decoding = "async"
                            />
                        <p class="typo-title-section" id="status" >...Verbindung wird hergestellt...</p>
                        </div>
                </section>
            </div>

            <!--selection dashboard-->
            <div class="main-container" id="page">
                <section class="centered-section" id="tree-selection">
                    <div class="centered-container" id="selection-container">
                        <div class="typo-title">BAUM AUSWAHL</div>
                        <!-- cards are generated by tree_thumbnail.js, one per target tree -->
                         <div class="scroll-section autoShow">
                            <div class="scroll-container"></div>
                            <!-- one dot per card, filled in by tree_selection.js once cards exist -->
                            <div class="dots-container" id="dots-container"></div>
                         </div>
                    </div>
                </section>

                <section class="centered-section" id="preview-section">
                    <div class="centered-container" id="preview-container">
                        <div class="orbit-container" id="orbit-preview">
                            <div class="tree-canvas" id="target-tree"></div>
                        </div>
                        <div id="level-container">
                            <div class="level" id="level-1">einfach</div>
                            <div class="level" id="level-2">schwierig</div>
                        </div> 
                         <div class="button-container">
                            <div class="button" id="ok-button">
                                <img id="arrow-button" src="img/arrow_left.png">
                            </div> <!-- tree_preview side opens with selected target tree-->
                            <div class="button" id="zurück">zurück</div>    
                        </div>
                    </div>
                </section>
            </div>



        </main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
        <script type="module" src="./src/main.js"></script>
        <script type="module" src="./src/visualization/tree_thumbnail.js"></script>
        <script type="module" src="./src/animation/tree_selection.js"></script>
    </body>
